<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job lifecycle — shared runner pool</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>One CI job through the pool</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="job-lifecycle-title job-lifecycle-desc">
      <title id="job-lifecycle-title">Lifecycle of one CI job through the shared runner pool</title>
      <desc id="job-lifecycle-desc">Seven-step flow from GitHub queuing a job to the runner exiting and its pod being deleted, with two safety checks called out: a host witness that must confirm physical cleanup before a slot is released, and quarantine after repeated provisioning failures.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Main row connectors (drawn before boxes) -->
      <line x1="148" y1="205" x2="168" y2="205" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="276" y1="205" x2="296" y2="205" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="404" y1="205" x2="424" y2="205" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="532" y1="205" x2="552" y2="205" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="660" y1="205" x2="680" y2="205" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="788" y1="205" x2="808" y2="205" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Safety-check connectors (dashed, straight down, drawn before the safety boxes) -->
      <line x1="478" y1="250" x2="478" y2="320" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <line x1="862" y1="250" x2="862" y2="320" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

      <!-- S1 GitHub queues job -->
      <rect x="40" y="160" width="108" height="90" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <circle cx="56" cy="176" r="10" fill="rgba(45,49,66,0.08)" stroke="#2d3142" stroke-width="0.8"/>
      <text x="56" y="180" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <text x="94" y="204" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GitHub queues</text>
      <text x="94" y="218" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">a job</text>
      <text x="94" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">label: slipway-linux</text>

      <!-- S2 Controller discovers repo -->
      <rect x="168" y="160" width="108" height="90" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <circle cx="184" cy="176" r="10" fill="rgba(45,49,66,0.08)" stroke="#2d3142" stroke-width="0.8"/>
      <text x="184" y="180" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>
      <text x="222" y="204" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Controller</text>
      <text x="222" y="218" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">discovers repo</text>
      <text x="222" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">App install · reserves slot</text>

      <!-- S3 Controller mints JIT -->
      <rect x="296" y="160" width="108" height="90" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <circle cx="312" cy="176" r="10" fill="rgba(45,49,66,0.08)" stroke="#2d3142" stroke-width="0.8"/>
      <text x="312" y="180" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">3</text>
      <text x="350" y="204" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Controller</text>
      <text x="350" y="218" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mints JIT</text>
      <text x="350" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">one-use runner config</text>

      <!-- S4 Controller creates pod -->
      <rect x="424" y="160" width="108" height="90" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <circle cx="440" cy="176" r="10" fill="rgba(45,49,66,0.08)" stroke="#2d3142" stroke-width="0.8"/>
      <text x="440" y="180" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">4</text>
      <text x="478" y="204" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Controller</text>
      <text x="478" y="218" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">creates pod</text>
      <text x="478" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">create intent recorded first</text>

      <!-- S5 Kata VM boots & bootstraps -->
      <rect x="552" y="160" width="108" height="90" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <circle cx="568" cy="176" r="10" fill="rgba(45,49,66,0.08)" stroke="#2d3142" stroke-width="0.8"/>
      <text x="568" y="180" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">5</text>
      <text x="606" y="200" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kata VM boots</text>
      <text x="606" y="214" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">&amp; bootstraps</text>
      <text x="606" y="230" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">narrow HTTPS · per-lease token</text>
      <text x="606" y="242" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">fetches JIT config</text>

      <!-- S6 Job runs -->
      <rect x="680" y="160" width="108" height="90" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <circle cx="696" cy="176" r="10" fill="rgba(45,49,66,0.08)" stroke="#2d3142" stroke-width="0.8"/>
      <text x="696" y="180" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">6</text>
      <text x="734" y="210" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Job runs</text>
      <text x="734" y="228" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">its own Docker daemon</text>

      <!-- S7 Runner exits, pod deleted -->
      <rect x="808" y="160" width="108" height="90" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <circle cx="824" cy="176" r="10" fill="rgba(45,49,66,0.08)" stroke="#2d3142" stroke-width="0.8"/>
      <text x="824" y="180" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">7</text>
      <text x="862" y="204" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Runner exits,</text>
      <text x="862" y="218" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pod deleted</text>

      <!-- Safety check 2: quarantine, under step 4 -->
      <rect x="378" y="320" width="200" height="84" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,4"/>
      <text x="478" y="340" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">SAFETY CHECK · QUARANTINE</text>
      <text x="478" y="360" fill="#2d3142" font-size="9.5" font-family="'Geist', sans-serif" text-anchor="middle">Three provisioning failures</text>
      <text x="478" y="374" fill="#2d3142" font-size="9.5" font-family="'Geist', sans-serif" text-anchor="middle">within fifteen minutes</text>
      <text x="478" y="392" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="middle">quarantine provisioning</text>

      <!-- Safety check 1: host witness, under step 7 -->
      <rect x="762" y="320" width="200" height="84" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,4"/>
      <text x="862" y="340" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">SAFETY CHECK · HOST WITNESS</text>
      <text x="862" y="360" fill="#2d3142" font-size="9.5" font-family="'Geist', sans-serif" text-anchor="middle">Confirms VM, snapshots &amp;</text>
      <text x="862" y="374" fill="#2d3142" font-size="9.5" font-family="'Geist', sans-serif" text-anchor="middle">devices are gone first</text>
      <text x="862" y="392" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="middle">pod disappearance alone never releases the slot</text>

      <!-- Footnote -->
      <line x1="40" y1="432" x2="960" y2="432" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="450" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Per homelab#717/#722 and internal/bootstrap/CONTRACT.md — no production pool is deployed yet.</text>
    </svg>
  </div>
</body>
</html>
