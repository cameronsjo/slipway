# expected: accept
# Generated by make-admission-cases.py. The worker image digest comes
# from services/runner-pool/image/review-image-lock.json; regenerate
# rather than editing a digest by hand.
apiVersion: v1
kind: Pod
metadata:
  name: slipway-linux-accept
  namespace: github-runner-pool
  labels:
    slipway/managed-by: slipway
    slipway/platform: linux
spec:
  runtimeClassName: sjo-kata-qemu-runner
  automountServiceAccountToken: false
  serviceAccountName: default
  volumes:
  - name: work
    emptyDir:
      medium: Memory
      sizeLimit: 2Gi
  - name: socket
    emptyDir:
      medium: Memory
      sizeLimit: 16Mi
  - name: tmp
    emptyDir:
      medium: Memory
      sizeLimit: 256Mi
  containers:
  - name: runner
    image: registry.example.invalid/slipway/linux-worker@sha256:1f884e0fd4b629b6c5760391b1c40e886469b51fd4c12b1bcf4a45f589eac371
    command:
    - /usr/local/bin/slipway-bootstrap
    args:
    - /usr/local/bin/runner-pool-worker
    - -controller
    - https://runner-pool-bootstrap.github-runner-pool.svc.cluster.local:8443
    - -lease
    - 11111111-1111-4111-8111-111111111111
    - -runner-root
    - /actions-runner
    - -ca-file
    - /etc/runner-pool/bootstrap/ca.pem
    env:
    - name: DOCKER_HOST
      value: unix:///var/run/docker.sock
    - name: RUNNER_TOOL_CACHE
      value: /actions-runner/_work/_tool
    - name: SLIPWAY_BOOTSTRAP_EXPECTED_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: SLIPWAY_BOOTSTRAP_EXPECTED_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    securityContext:
      privileged: false
      runAsNonRoot: true
  - name: dockerd
    image: docker.io/library/docker@sha256:7bf70dcb85c822e3fa6f2d332143e474b99147b9d7b39102b0cfe8b04a7dd61b
    command:
    - dockerd-entrypoint.sh
    args:
    - dockerd
    - --host=unix:///var/run/docker.sock
    - --data-root=/var/lib/sjo-docker
    - --exec-root=/var/run/docker
    - --storage-driver=overlay2
    - --ip6tables=false
    - --group=121
    securityContext:
      privileged: true
